# Trigger rebuild with environment variables
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://wexqsxrayjlahwaasijv.supabase.co; style-src 'self' 'unsafe-inline'; connect-src 'self' https://wexqsxrayjlahwaasijv.supabase.co; img-src 'self' data: blob: https://wexqsxrayjlahwaasijv.supabase.co https://images.unsplash.com; font-src 'self' data:; frame-ancestors 'none';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

